services:
  php:
    build:
      context: .
    working_dir: /app
    command: php -S 0.0.0.0:8080 -t public public/index.php
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - vendor:/app/vendor
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://cine:cine@database:3306/cine?serverVersion=8.4.0&charset=utf8mb4
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cine
      MYSQL_USER: cine
      MYSQL_PASSWORD: cine
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database:
  vendor:
